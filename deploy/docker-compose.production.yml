name: ${COMPOSE_PROJECT_NAME:-yuking-restaurant-saas}

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILES:-3}

services:
  mysql:
    <<: *service-defaults
    image: ${MYSQL_IMAGE:-mysql:8.4}
    mem_limit: ${MYSQL_MEMORY_LIMIT:-512m}
    cpus: ${MYSQL_CPU_LIMIT:-0.75}
    pids_limit: 256
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_APP_USER:?DB_APP_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --slow-query-log=ON
      - --long-query-time=1
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --innodb-log-buffer-size=16M
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-60}
      - --table-open-cache=400
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --performance-schema=OFF
    volumes:
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/mysql/data:/var/lib/mysql
      - ${PROJECT_SOURCE:-..}/docs/phase1-acceptance/schema-phase1.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${PROJECT_SOURCE:-..}/sql/mysql/update.sql:/docker-entrypoint-initdb.d/02-migrations.sql:ro
      - ${PROJECT_SOURCE:-..}/sql/mysql/yuking_template.sql:/docker-entrypoint-initdb.d/03-template-defaults.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    mem_limit: ${REDIS_MEMORY_LIMIT:-160m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    pids_limit: 128
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000 --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data

  mongodb:
    <<: *service-defaults
    image: ${MONGO_IMAGE:-mongo:8.0}
    mem_limit: ${MONGO_MEMORY_LIMIT:-384m}
    cpus: ${MONGO_CPU_LIMIT:-0.50}
    pids_limit: 256
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:?MONGO_APP_DATABASE is required}
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    command:
      - mongod
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - ${MONGO_WIREDTIGER_CACHE_GB:-0.25}
      - --setParameter
      - diagnosticDataCollectionEnabled=false
    volumes:
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/mongo/data:/data/db
      - ./mongodb/init/01-create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s
    networks:
      - data

  backend:
    <<: *service-defaults
    build:
      context: ${PROJECT_SOURCE:-..}
      dockerfile: deploy/backend.Dockerfile
      args:
        RUNTIME_IMAGE: ${BACKEND_RUNTIME_IMAGE:-eclipse-temurin:8-jre-jammy}
    image: ${BACKEND_IMAGE:-yuking/restaurant-saas:1.6.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.25}
    pids_limit: 256
    stop_grace_period: 45s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_APP_USER:?DB_APP_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      SPRING_MAIL_HOST: ${MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${MAIL_PORT:-25}
      PAYMENT_CONFIG_MASTER_KEY: ${PAYMENT_CONFIG_MASTER_KEY:-}
      WECHAT_PAY_NOTIFY_BASE_URL: ${WECHAT_PAY_NOTIFY_BASE_URL:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_OPEN_APP_ID: ${WECHAT_OPEN_APP_ID:-}
      WECHAT_OPEN_APP_SECRET: ${WECHAT_OPEN_APP_SECRET:-}
      MERCHANT_WEBSOCKET_ALLOWED_ORIGINS: ${MERCHANT_WEBSOCKET_ALLOWED_ORIGINS:?MERCHANT_WEBSOCKET_ALLOWED_ORIGINS is required}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      BAIDU_MAP_AK: ${BAIDU_MAP_AK:-}
      XINYEYUN_USER: ${XINYEYUN_USER:-}
      XINYEYUN_KEY: ${XINYEYUN_KEY:-}
      SERVER_MAX_THREADS: ${SERVER_MAX_THREADS:-80}
      SERVER_ACCEPT_COUNT: ${SERVER_ACCEPT_COUNT:-50}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-8}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-12}
      REDIS_POOL_MAX_IDLE: ${REDIS_POOL_MAX_IDLE:-4}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-1}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs}
    volumes:
      - ${PROJECT_SOURCE:-..}/siam-system/system-provider/src/main/resources/application-prod.yml.template:/app/config/application-prod.yml:ro
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/siam-server/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 60s
    networks:
      - app
      - data

  nginx:
    <<: *service-defaults
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    mem_limit: ${NGINX_MEMORY_LIMIT:-96m}
    cpus: ${NGINX_CPU_LIMIT:-0.25}
    pids_limit: 128
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      BACKEND_UPSTREAM: backend:9200
      NGINX_ENVSUBST_FILTER: ^(PUBLIC_DOMAIN|BACKEND_UPSTREAM)$$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates/${NGINX_TEMPLATE:-api-http.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/nginx/certbot/conf:/etc/letsencrypt:ro
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/nginx/certbot/www:/var/www/certbot:ro
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - app

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["tls"]
    volumes:
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/nginx/certbot/conf:/etc/letsencrypt
      - ${DEPLOY_ROOT:-/opt/restaurant-saas}/nginx/certbot/www:/var/www/certbot
    entrypoint: certbot
    networks:
      - edge

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
